<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="wordGame.css">
    <script src="wordGame.js" defer></script>
</head>
<body>
 
    <div class="card">
        <h2 class="heading">Guess the Word !</h2>
        <h3 class="heading">Quietly spoken words</h3>
        <p id="guessMsg"></p>
        <p id="clue"></p>
        <div class="inputContainer" id="inputContainer">   
        </div>
        <p id="msg"></p>
        <input type="text" placeholder="Type one letter" id="userInput"> <button id="guessbtn">Guess</button>
        <button id="exitbtn" >Exit Game</button>
        <button id="resetbtn">Reset Game</button>
    </div>
    
</body>
</html>
